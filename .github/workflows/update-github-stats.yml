name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # Every day at 03:17 UTC

permissions:
  contents: write

concurrency:
  group: update-github-profile-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG stats card
        env:
          GITHUB_USERNAME: Abhigyan6091
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_github_stats.py

      - name: Commit updated card if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "Stats card is already current."
          else
            git commit -m "chore: refresh GitHub profile stats"
            git push
          fi
